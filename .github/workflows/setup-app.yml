      - name: Initialize PostgreSQL database
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DB_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "=== Ensure database exists ==="

            sudo -u postgres psql -tAc \
              "SELECT 1 FROM pg_database WHERE datname = 'migration_lab'" \
              | grep -q 1 || \
              sudo -u postgres createdb migration_lab

            echo "=== Create application tables ==="

            sudo -u postgres psql -v ON_ERROR_STOP=1 -d migration_lab <<'SQL'
            CREATE TABLE IF NOT EXISTS users (
                id BIGSERIAL PRIMARY KEY,
                email TEXT NOT NULL UNIQUE,
                password_hash TEXT NOT NULL,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
            );

            CREATE TABLE IF NOT EXISTS posts (
                id BIGSERIAL PRIMARY KEY,
                user_id BIGINT NOT NULL REFERENCES users(id),
                title TEXT NOT NULL,
                content TEXT NOT NULL,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
            );

            CREATE INDEX IF NOT EXISTS idx_posts_user_id
                ON posts(user_id);
            SQL

            echo "=== Verify tables ==="

            sudo -u postgres psql -d migration_lab -c '\dt'
            echo "=== Database initialization complete ==="