name: Setup k6 EC2

on:
  workflow_dispatch:

jobs:
  setup-k6:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem

      - name: Install k6
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_2 }}" << 'EOF'

            set -e

            echo "Updating system..."
            sudo dnf update -y

            echo "Installing k6 repository..."
            sudo dnf install -y https://dl.k6.io/rpm/repo.rpm

            echo "Installing k6..."
            sudo dnf install -y k6

            echo "k6 version:"
            k6 version

            echo "EC2-2 k6 setup completed."

          EOF